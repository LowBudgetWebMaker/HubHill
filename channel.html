
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Channel - HubHill</title>
<link rel="icon" href="HubHill.png" type="image/png">
<link rel="stylesheet" href="auth.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="auth.js" defer></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #e9edf2;
  color: #333;
  font: 13px Arial, sans-serif;
}

a { color: #155a9c; text-decoration: none; }
a:hover { text-decoration: underline; }

header {
  background: white;
  border-bottom: 1px solid #aaa;
  padding: 12px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  font-size: 26px;
  font-weight: bold;
  color: #225d9c;
}

.brand span { color: #555; }

nav {
  background: linear-gradient(#397dbb, #20558d);
  border-bottom: 2px solid #153e6b;
}

.nav-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  flex-wrap: wrap;
}

nav a {
  padding: 12px 20px;
  color: white;
  font-weight: bold;
}

nav a:hover { background: #164673; }

.container {
  max-width: 1000px;
  margin: 20px auto;
  padding: 0 12px;
}

.panel {
  background: white;
  border: 1px solid #b8c4d1;
  margin-bottom: 18px;
}

.panel-title {
  background: linear-gradient(#eaf3fc, #c8dff4);
  color: #245b91;
  font-size: 15px;
  font-weight: bold;
  padding: 10px;
  border-bottom: 1px solid #b8c4d1;
}

.panel-content { padding: 18px; }

.channel-banner {
  height: 150px;
  background: linear-gradient(120deg, #174c80, #5e9bd0);
  border-bottom: 1px solid #999;
}

.channel-info {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.avatar {
  width: 90px;
  height: 90px;
  background: #d9e5f2;
  border: 1px solid #aaa;
  display: grid;
  place-items: center;
  font-size: 38px;
  font-weight: bold;
  color: #245b91;
}

.channel-name {
  font-size: 23px;
  font-weight: bold;
  color: #245b91;
}

.channel-username {
  color: #777;
  margin-top: 5px;
}

label {
  display: block;
  margin: 12px 0 5px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  max-width: 500px;
  padding: 9px;
  border: 1px solid #aaa;
  font: 13px Arial, sans-serif;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  background: linear-gradient(#fff, #ddd);
  border: 1px solid #999;
  padding: 8px 15px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 12px;
}

button:hover { background: #dce9f7; }
button:disabled { opacity: .5; cursor: wait; }

.status {
  margin-top: 12px;
  font-weight: bold;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 18px;
}

.video-card {
  min-width: 0;
  border: 1px solid #ddd;
  padding: 10px;
  background: #fafafa;
}

.video-thumbnail {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 115px;
  background: linear-gradient(135deg,#aec5dc,#416e9e);
  color: white;
  font-size: 34px;
  border: 1px solid #999;
  margin-bottom: 9px;
}

.video-title {
  font-weight: bold;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.video-details {
  color: #777;
  font-size: 11px;
  line-height: 1.7;
  margin-top: 5px;
}

.delete-button {
  color: #a40000;
  margin-top: 10px;
}

.empty {
  color: #777;
  padding: 10px 0;
}

[hidden] { display: none !important; }

@media(max-width:750px) {
  .video-grid { grid-template-columns: repeat(2,1fr); }
}

@media(max-width:420px) {
  .video-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="brand">
      Hub<span>Hill</span>
    </a>

    <div class="auth-links">
      <span data-auth-guest>
        <a href="#" data-open-auth="login">Log In</a>
      </span>

      <span data-auth-user hidden>
        Welcome, <span data-username></span> |
        <button type="button" data-logout>Log Out</button>
      </span>
    </div>
  </div>
</header>

<nav>
  <div class="nav-inner">
    <a href="index.html">Home</a>
    <a href="index.html#featured">Videos</a>
    <a href="channel.html">My Channel</a>
    <a href="upload.html">Upload</a>
  </div>
</nav>

<div class="container">

  <section class="panel">
    <div class="channel-banner"></div>

    <div class="panel-content">
      <div class="channel-info">
        <div class="avatar" id="avatar">H</div>

        <div>
          <div class="channel-name" id="channelName">
            Loading...
          </div>

          <div class="channel-username" id="channelUsername"></div>
        </div>
      </div>

      <p id="channelBio"></p>
    </div>
  </section>

  <section class="panel" id="editorPanel" hidden>
    <div class="panel-title">Edit My Channel</div>

    <div class="panel-content">
      <form id="profileForm">

        <label for="usernameInput">Username</label>
        <input id="usernameInput"
               minlength="3"
               maxlength="25"
               pattern="[a-zA-Z0-9_]+"
               placeholder="Example: RetroGamer"
               required>

        <label for="displayInput">Display Name</label>
        <input id="displayInput"
               maxlength="60"
               placeholder="Your channel name"
               required>

        <label for="bioInput">Channel Description</label>
        <textarea id="bioInput"
                  maxlength="500"
                  placeholder="Tell people about your channel..."></textarea>

        <p>Maximum 500 characters for your description.</p>

        <button type="submit" id="saveButton">
          Save Channel
        </button>

        <p class="status" id="status"></p>
      </form>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">My Videos</div>

    <div class="panel-content">
      <p id="videoStatus">Loading your videos...</p>
      <div class="video-grid" id="myVideoGrid"></div>
    </div>
  </section>

</div>

<script>
let currentUser = null;

async function loadChannel() {
  const { data: authData, error: authError } =
    await supabaseClient.auth.getUser();

  const user = authData.user;

  if (authError || !user) {
    currentUser = null;

    document.getElementById("channelName").textContent =
      "Log in to view your channel.";

    document.getElementById("editorPanel").hidden = true;
    document.getElementById("myVideoGrid").replaceChildren();

    document.getElementById("videoStatus").textContent =
      "Log in to see your uploaded videos.";

    return;
  }

  currentUser = user;

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (error) {
    document.getElementById("channelName").textContent =
      "Unable to load channel.";
  } else {
    const name = profile.display_name || "HubHill User";

    document.getElementById("channelName").textContent = name;
    document.getElementById("channelUsername").textContent =
      profile.username ? "@" + profile.username : "No username set";

    document.getElementById("channelBio").textContent =
      profile.bio || "No channel description yet.";

    document.getElementById("avatar").textContent =
      name.charAt(0).toUpperCase();

    document.getElementById("usernameInput").value =
      profile.username || "";

    document.getElementById("displayInput").value =
      profile.display_name || "";

    document.getElementById("bioInput").value =
      profile.bio || "";

    document.getElementById("editorPanel").hidden = false;
  }

  await loadMyVideos(user.id);
}

async function loadMyVideos(userID) {
  const status = document.getElementById("videoStatus");
  const grid = document.getElementById("myVideoGrid");

  status.textContent = "Loading your videos...";
  grid.replaceChildren();

  const { data: videos, error } = await supabaseClient
    .from("videos")
    .select("id,title,category,views,created_at,storage_key")
    .eq("user_id", userID)
    .order("created_at", { ascending: false });

  if (error) {
    status.textContent = "Error: " + error.message;
    return;
  }

  if (!videos || !videos.length) {
    status.textContent = "You haven't uploaded any videos yet.";
    return;
  }

  status.textContent = "";

  videos.forEach(video => {
    const card = document.createElement("div");
    card.className = "video-card";

    const thumbnail = document.createElement("a");
    thumbnail.className = "video-thumbnail";
    thumbnail.href = "watch.html?id=" +
      encodeURIComponent(video.id);
    thumbnail.textContent = "▶";

    const title = document.createElement("div");
    title.className = "video-title";

    const titleLink = document.createElement("a");
    titleLink.href = thumbnail.href;
    titleLink.textContent = video.title;
    title.appendChild(titleLink);

    const details = document.createElement("div");
    details.className = "video-details";
    details.textContent =
      "Category: " + video.category +
      " | Views: " + (video.views || 0);

    const watchLink = document.createElement("a");
    watchLink.href = thumbnail.href;
    watchLink.textContent = "Watch Video";

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete-button";
    deleteButton.textContent = "Delete Video";

    deleteButton.addEventListener("click", async () => {
      await deleteVideo(video, deleteButton);
    });

    card.append(
      thumbnail,
      title,
      details,
      watchLink,
      document.createElement("br"),
      deleteButton
    );

    grid.appendChild(card);
  });
}

async function deleteVideo(video, button) {
  if (!currentUser) {
    alert("Please log in first.");
    return;
  }

  const confirmed = confirm(
    "Permanently delete \"" + video.title + "\"?\n\n" +
    "This will remove the video file and its information. " +
    "This cannot be undone."
  );

  if (!confirmed) return;

  button.disabled = true;
  button.textContent = "Deleting...";

  try {
    const { data: authData, error: authError } =
      await supabaseClient.auth.getUser();

    if (authError || !authData.user) {
      throw new Error("Please log in again.");
    }

    const user = authData.user;

    if (user.id !== currentUser.id) {
      throw new Error("Account changed. Refresh the page.");
    }

    const { data: record, error: recordError } =
      await supabaseClient
        .from("videos")
        .select("id,user_id,storage_key")
        .eq("id", video.id)
        .eq("user_id", user.id)
        .single();

    if (recordError || !record) {
      throw new Error("Video not found or not owned by you.");
    }

    const expectedPrefix = user.id + "/";

    if (!record.storage_key.startsWith(expectedPrefix)) {
      throw new Error("Invalid video storage path.");
    }

    // Delete the actual stored file first.
    const { data: removedFiles, error: storageError } =
      await supabaseClient.storage
        .from("hubhill-videos")
        .remove([record.storage_key]);

    if (storageError) {
      throw storageError;
    }

    // Supabase can return success even if no object was removed.
    if (!removedFiles || !removedFiles.some(
      file => file.name === record.storage_key ||
              file.name === record.storage_key.split("/").pop()
    )) {
      throw new Error(
        "Storage did not confirm file deletion. " +
        "Check Supabase Storage before retrying."
      );
    }

    // Remove the database record after storage deletion.
    const { data: deletedRows, error: databaseError } =
      await supabaseClient
        .from("videos")
        .delete()
        .eq("id", record.id)
        .eq("user_id", user.id)
        .select("id");

    if (databaseError) {
      throw databaseError;
    }

    if (!deletedRows || !deletedRows.length) {
      throw new Error(
        "File removed, but the database did not confirm deletion."
      );
    }

    alert("Video permanently deleted!");

    await loadMyVideos(user.id);

  } catch (error) {
    alert("Deletion failed: " + error.message);

    button.disabled = false;
    button.textContent = "Delete Video";
  }
}

document.getElementById("profileForm").addEventListener(
  "submit",
  async event => {
    event.preventDefault();

    const status = document.getElementById("status");
    const button = document.getElementById("saveButton");

    status.textContent = "Saving...";
    status.style.color = "#555";
    button.disabled = true;

    const { data: authData } =
      await supabaseClient.auth.getUser();

    const user = authData.user;

    if (!user) {
      status.textContent = "Please log in first.";
      button.disabled = false;
      return;
    }

    const username =
      document.getElementById("usernameInput")
        .value.trim().toLowerCase();

    const displayName =
      document.getElementById("displayInput")
        .value.trim();

    const bio =
      document.getElementById("bioInput").value.trim();

    const { error } = await supabaseClient
      .from("profiles")
      .update({
        username: username,
        display_name: displayName,
        bio: bio
      })
      .eq("id", user.id);

    if (error) {
      status.textContent = "Error: " + error.message;
      status.style.color = "#b00020";
    } else {
      status.textContent = "Channel saved successfully!";
      status.style.color = "#176b35";

      await loadChannel();
      await updateAuthUI();
    }

    button.disabled = false;
  }
);

document.addEventListener("DOMContentLoaded", loadChannel);

supabaseClient.auth.onAuthStateChange(() => {
  setTimeout(loadChannel, 0);
});
</script>

</body>
</html>
