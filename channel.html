
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel - HubHill</title>
<link rel="icon" href="HubHill.png" type="image/png">
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>

<script src="auth.js" defer></script>
<script src="site-header.js" defer></script>


<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf2;color:#333;font:13px Arial,sans-serif}
a{color:#155a9c;text-decoration:none}
a:hover{text-decoration:underline}
header{background:#fff;border-bottom:1px solid #aaa}
.header-inner{max-width:1100px;margin:auto;min-height:78px;padding:5px 12px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{width:175px;height:65px;flex-shrink:0;text-align:center}
.logo-crop{display:block;width:175px;height:48px;overflow:hidden;position:relative}
.logo-crop img{position:absolute;width:175px;height:175px;max-width:none;top:-59px;left:0}
.slogan{font-size:10px;color:#777;text-align:center;margin-top:1px}
nav{background:linear-gradient(#397dbb,#20558d);border-bottom:2px solid #153e6b}
.nav-inner{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap}
nav a{padding:12px 20px;color:white;font-weight:bold;border-right:1px solid #174b7e}
nav a:hover{background:#164673;text-decoration:none}
.container{max-width:1000px;margin:20px auto;padding:0 12px}
.panel{background:#fff;border:1px solid #b8c4d1;margin-bottom:18px}
.panel-title{background:linear-gradient(#eaf3fc,#c8dff4);color:#245b91;font-size:15px;font-weight:bold;padding:10px;border-bottom:1px solid #b8c4d1}
.panel-content{padding:18px}
.channel-banner{height:150px;background:linear-gradient(120deg,#174c80,#5e9bd0);border-bottom:1px solid #999}
.channel-info{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.avatar{width:90px;height:90px;background:#d9e5f2;border:1px solid #aaa;display:grid;place-items:center;font-size:38px;font-weight:bold;color:#245b91;flex-shrink:0}
.channel-name{font-size:23px;font-weight:bold;color:#245b91}
.channel-username{color:#777;margin-top:5px}
#channelBio{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin-top:18px}
label{display:block;margin:12px 0 5px;font-weight:bold}
input,textarea{width:100%;max-width:500px;padding:9px;border:1px solid #aaa;font:13px Arial,sans-serif}
textarea{min-height:100px;resize:vertical}
button{background:linear-gradient(#fff,#ddd);border:1px solid #999;padding:8px 15px;cursor:pointer;font-weight:bold;margin-top:12px}
button:hover{background:#dce9f7}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:12px;font-weight:bold}
.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.video-card{min-width:0;border:1px solid #ddd;padding:10px;background:#fafafa}
.video-thumbnail{display:flex;align-items:center;justify-content:center;height:115px;background:linear-gradient(135deg,#aec5dc,#416e9e);color:white;font-size:34px;border:1px solid #999;margin-bottom:9px;position:relative;overflow:hidden}
.video-thumbnail video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.play-symbol{position:relative;z-index:1;text-shadow:0 1px 5px #222}
.video-title{font-weight:bold;line-height:1.5;overflow-wrap:anywhere}
.video-details{color:#777;font-size:11px;line-height:1.7;margin-top:5px}
.delete-button{color:#a40000;margin-top:10px}
.empty{color:#777;padding:10px 0}
.subscription-area{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
#subscriberCount{font-size:12px;color:#666}
#subscribeButton{background:linear-gradient(#e44d42,#a91f18);color:white;border:1px solid #891711;margin:0}
#subscribeButton.subscribed{background:linear-gradient(#fff,#ddd);color:#444;border-color:#999}
#subscriptionStatus{font-size:12px}
footer{text-align:center;padding:25px;color:#777;border-top:1px solid #ccc}
[hidden]{display:none!important}
@media(max-width:750px){.video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.video-grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<header>
<div class="header-inner">
<div class="brand">
<a href="index.html" class="logo-crop">
<img src="HubHill.png" alt="HubHill">
</a>
<div class="slogan">Your World. Your Watch.</div>
</div>

<div class="auth-links">
<span data-auth-guest>
<a href="#" data-open-auth="signup">Sign Up</a> |
<a href="#" data-open-auth="login">Log In</a>
</span>
<span data-auth-user hidden>
Welcome,
<a href="channel.html"><strong data-username></strong></a> |
<button type="button" data-logout>Log Out</button>
</span>
</div>
</div>
</header>

<nav>
<div class="nav-inner">
<a href="index.html">Home</a>
<a href="index.html#featured">Videos</a>
<a href="index.html#categories">Categories</a>
<a href="channel.html">My Channel</a>
<a href="upload.html">Upload</a>
<a href="favorites.html">My Favorites</a>
<a href="subscriptions.html">My Subscriptions</a>
</div>
</nav>

<div class="container">

<section class="panel">
<div class="channel-banner"></div>
<div class="panel-content">
<div class="channel-info">
<div class="avatar" id="avatar">H</div>
<div>
<div class="channel-name" id="channelName">Loading...</div>
<div class="channel-username" id="channelUsername"></div>

<div class="subscription-area">
<span id="subscriberCount">Loading subscribers...</span>
<button id="subscribeButton" type="button" hidden>Subscribe</button>
<span id="subscriptionStatus"></span>
</div>
</div>
</div>
<p id="channelBio"></p>
</div>
</section>

<section class="panel" id="editorPanel" hidden>
<div class="panel-title">Edit My Channel</div>
<div class="panel-content">
<form id="profileForm">
<label for="usernameInput">Username</label>
<input id="usernameInput" minlength="3" maxlength="25"
pattern="[a-zA-Z0-9_]+" placeholder="Example: RetroGamer" required>

<label for="displayInput">Display Name</label>
<input id="displayInput" maxlength="60"
placeholder="Your channel name" required>

<label for="bioInput">Channel Description</label>
<textarea id="bioInput" maxlength="500"
placeholder="Tell people about your channel..."></textarea>

<p>Maximum 500 characters for your description.</p>
<button type="submit" id="saveButton">Save Channel</button>
<p class="status" id="status"></p>
</form>
</div>
</section>

<section class="panel">
<div class="panel-title" id="videosHeading">Channel Videos</div>
<div class="panel-content">
<p id="videoStatus">Loading videos...</p>
<div class="video-grid" id="myVideoGrid"></div>
</div>
</section>

</div>

<footer>HubHill &copy; 2026 - Your World. Your Watch.</footer>

<script>
const params=new URLSearchParams(location.search);
const requestedUserID=params.get("user");

let currentUser=null;
let channelOwnerID=null;
let viewingOwnChannel=false;
let isSubscribed=false;
let subscriptionBusy=false;

const subscribeButton=document.getElementById("subscribeButton");
const subscriberCountElement=document.getElementById("subscriberCount");
const subscriptionStatus=document.getElementById("subscriptionStatus");

function setSubscriptionStatus(message,isError=false){
subscriptionStatus.textContent=message;
subscriptionStatus.style.color=isError?"#b00020":"#176b35";
}

function paintSubscription(){
subscribeButton.textContent=isSubscribed?"Subscribed ✓":"Subscribe";
subscribeButton.classList.toggle("subscribed",isSubscribed);
}

async function refreshSubscriberCount(){
const {count,error}=await supabaseClient
.from("channel_subscriptions")
.select("subscriber_id",{count:"exact",head:true})
.eq("channel_id",channelOwnerID);

if(error)throw error;

const number=count||0;
subscriberCountElement.textContent=
number+" subscriber"+(number===1?"":"s");
}

async function loadSubscription(){
subscribeButton.hidden=true;
setSubscriptionStatus("");
subscriberCountElement.textContent="Loading subscribers...";

try{
if(!channelOwnerID)return;

await refreshSubscriberCount();

if(viewingOwnChannel){
setSubscriptionStatus("This is your channel.");
return;
}

subscribeButton.hidden=false;

if(!currentUser){
isSubscribed=false;
paintSubscription();
setSubscriptionStatus("Log in to subscribe.");
return;
}

const {data,error}=await supabaseClient
.from("channel_subscriptions")
.select("channel_id")
.eq("subscriber_id",currentUser.id)
.eq("channel_id",channelOwnerID)
.maybeSingle();

if(error)throw error;

isSubscribed=!!data;
paintSubscription();

}catch(error){
setSubscriptionStatus("Subscription error: "+error.message,true);
}
}

subscribeButton.addEventListener("click",async()=>{
if(subscriptionBusy||!channelOwnerID)return;

if(!currentUser){
setSubscriptionStatus("Please log in to subscribe.",true);
return;
}

if(currentUser.id===channelOwnerID){
setSubscriptionStatus("You cannot subscribe to yourself.",true);
return;
}

subscriptionBusy=true;
subscribeButton.disabled=true;
setSubscriptionStatus("");

try{
if(isSubscribed){
const {data,error}=await supabaseClient
.from("channel_subscriptions")
.delete()
.eq("subscriber_id",currentUser.id)
.eq("channel_id",channelOwnerID)
.select("channel_id");

if(error)throw error;
if(!data||data.length!==1){
throw new Error("Subscription was not removed.");
}

isSubscribed=false;
setSubscriptionStatus("Unsubscribed successfully.");
}else{
const {error}=await supabaseClient
.from("channel_subscriptions")
.insert({
subscriber_id:currentUser.id,
channel_id:channelOwnerID
});

if(error)throw error;

isSubscribed=true;
setSubscriptionStatus("Subscribed successfully!");
}

paintSubscription();
await refreshSubscriberCount();

}catch(error){
setSubscriptionStatus("Subscription failed: "+error.message,true);
}finally{
subscriptionBusy=false;
subscribeButton.disabled=false;
}
});

/* CHANNEL PROFILE */

async function loadChannel(){
const channelName=document.getElementById("channelName");
const videoStatus=document.getElementById("videoStatus");

try{
const {data:authData,error:authError}=
await supabaseClient.auth.getUser();

if(authError)throw authError;

currentUser=authData.user||null;
channelOwnerID=requestedUserID||(currentUser?currentUser.id:null);
viewingOwnChannel=!!(
currentUser&&channelOwnerID===currentUser.id
);

document.getElementById("editorPanel").hidden=true;
subscribeButton.hidden=true;

if(!channelOwnerID){
channelName.textContent="Log in to view your channel.";
document.getElementById("channelUsername").textContent="";
document.getElementById("channelBio").textContent="";
subscriberCountElement.textContent="";
videoStatus.textContent="Log in to see your uploaded videos.";
document.getElementById("myVideoGrid").replaceChildren();
return;
}

const {data:profile,error:profileError}=await supabaseClient
.from("profiles")
.select("id,username,display_name,bio")
.eq("id",channelOwnerID)
.maybeSingle();

if(profileError)throw profileError;

if(!profile){
channelName.textContent="Channel not found.";
videoStatus.textContent="This channel is unavailable.";
subscriberCountElement.textContent="";
return;
}

const name=profile.display_name||profile.username||"HubHill User";

document.title=name+" - HubHill";
channelName.textContent=name;

document.getElementById("channelUsername").textContent=
profile.username?"@"+profile.username:"";

document.getElementById("channelBio").textContent=
profile.bio||"No channel description yet.";

document.getElementById("avatar").textContent=
name.charAt(0).toUpperCase();

document.getElementById("videosHeading").textContent=
viewingOwnChannel?"My Videos":name+"'s Videos";

if(viewingOwnChannel){
document.getElementById("usernameInput").value=profile.username||"";
document.getElementById("displayInput").value=profile.display_name||"";
document.getElementById("bioInput").value=profile.bio||"";
document.getElementById("editorPanel").hidden=false;
}

await Promise.all([
loadSubscription(),
loadChannelVideos(channelOwnerID)
]);

}catch(error){
console.error("Channel loading:",error);
channelName.textContent="Unable to load channel.";
videoStatus.textContent="Error: "+error.message;
}
}

/* CHANNEL VIDEOS */

async function loadChannelVideos(userID){
const status=document.getElementById("videoStatus");
const grid=document.getElementById("myVideoGrid");

status.textContent="Loading videos...";
grid.replaceChildren();

try{
const {data:videos,error}=await supabaseClient
.from("videos")
.select("id,title,category,views,created_at,storage_key")
.eq("user_id",userID)
.order("created_at",{ascending:false});

if(error)throw error;

if(!videos||!videos.length){
status.textContent=viewingOwnChannel
?"You haven't uploaded any videos yet."
:"This channel hasn't uploaded any videos yet.";
return;
}

status.textContent="";

videos.forEach(video=>{
const card=document.createElement("div");
card.className="video-card";

const thumbnail=document.createElement("a");
thumbnail.className="video-thumbnail";
thumbnail.href="watch.html?id="+encodeURIComponent(video.id);

if(video.storage_key){
const {data}=supabaseClient.storage
.from("hubhill-videos")
.getPublicUrl(video.storage_key);

if(data?.publicUrl){
const preview=document.createElement("video");
preview.muted=true;
preview.preload="metadata";
preview.playsInline=true;
preview.setAttribute("aria-hidden","true");
preview.tabIndex=-1;
preview.src=data.publicUrl+"#t=0.1";
thumbnail.appendChild(preview);
}
}

const playSymbol=document.createElement("span");
playSymbol.className="play-symbol";
playSymbol.textContent="▶";
thumbnail.appendChild(playSymbol);

const title=document.createElement("div");
title.className="video-title";

const titleLink=document.createElement("a");
titleLink.href=thumbnail.href;
titleLink.textContent=video.title;
title.appendChild(titleLink);

const details=document.createElement("div");
details.className="video-details";
details.textContent=
"Category: "+(video.category||"Uncategorized")+
" | Views: "+(video.views||0);

const watchLink=document.createElement("a");
watchLink.href=thumbnail.href;
watchLink.textContent="Watch Video";

card.append(thumbnail,title,details,watchLink);

if(viewingOwnChannel){
const deleteButton=document.createElement("button");
deleteButton.type="button";
deleteButton.className="delete-button";
deleteButton.textContent="Delete Video";

deleteButton.addEventListener("click",async()=>{
await deleteVideo(video,deleteButton);
});

card.append(document.createElement("br"),deleteButton);
}

grid.appendChild(card);
});

}catch(error){
status.textContent="Error: "+error.message;
}
}

/* DELETE OWN VIDEO */

async function deleteVideo(video,button){
if(!currentUser||!viewingOwnChannel){
alert("You can only delete your own videos.");
return;
}

const confirmed=confirm(
'Permanently delete "'+video.title+'"?\n\n'+
"This will remove the video file and its information. "+
"This cannot be undone."
);

if(!confirmed)return;

button.disabled=true;
button.textContent="Deleting...";

try{
const {data:authData,error:authError}=
await supabaseClient.auth.getUser();

if(authError||!authData.user){
throw new Error("Please log in again.");
}

const user=authData.user;

if(user.id!==currentUser.id||user.id!==channelOwnerID){
throw new Error("Account changed. Refresh the page.");
}

const {data:record,error:recordError}=await supabaseClient
.from("videos")
.select("id,user_id,storage_key")
.eq("id",video.id)
.eq("user_id",user.id)
.single();

if(recordError||!record){
throw new Error("Video not found or not owned by you.");
}

const expectedPrefix=user.id+"/";

if(!record.storage_key||
!record.storage_key.startsWith(expectedPrefix)){
throw new Error("Invalid video storage path.");
}

// Remove the actual video file first.
const {data:removedFiles,error:storageError}=
await supabaseClient.storage
.from("hubhill-videos")
.remove([record.storage_key]);

if(storageError)throw storageError;

if(!removedFiles||!removedFiles.some(file=>
file.name===record.storage_key||
file.name===record.storage_key.split("/").pop()
)){
throw new Error(
"Storage did not confirm file deletion. "+
"Check Supabase Storage before retrying."
);
}

// Remove the database record after the file is deleted.
const {data:deletedRows,error:databaseError}=
await supabaseClient
.from("videos")
.delete()
.eq("id",record.id)
.eq("user_id",user.id)
.select("id");

if(databaseError)throw databaseError;

if(!deletedRows||!deletedRows.length){
throw new Error(
"File removed, but the database did not confirm deletion."
);
}

alert("Video permanently deleted!");
await loadChannelVideos(user.id);

}catch(error){
alert("Deletion failed: "+error.message);
button.disabled=false;
button.textContent="Delete Video";
}
}

/* EDIT OWN PROFILE */

document.getElementById("profileForm")
.addEventListener("submit",async event=>{
event.preventDefault();

const status=document.getElementById("status");
const button=document.getElementById("saveButton");

status.textContent="Saving...";
status.style.color="#555";
button.disabled=true;

try{
const {data:authData,error:authError}=
await supabaseClient.auth.getUser();

if(authError||!authData.user){
throw new Error("Please log in first.");
}

const user=authData.user;

if(user.id!==channelOwnerID){
throw new Error("You can only edit your own channel.");
}

const username=document.getElementById("usernameInput")
.value.trim().toLowerCase();

const displayName=document.getElementById("displayInput")
.value.trim();

const bio=document.getElementById("bioInput")
.value.trim();

if(!/^[a-z0-9_]{3,25}$/.test(username)){
throw new Error(
"Username must be 3–25 letters, numbers, or underscores."
);
}

if(!displayName||displayName.length>60){
throw new Error("Display name must be 1–60 characters.");
}

if(bio.length>500){
throw new Error("Description must be 500 characters or less.");
}

const {data:updated,error}=await supabaseClient
.from("profiles")
.update({
username:username,
display_name:displayName,
bio:bio
})
.eq("id",user.id)
.select("id");

if(error)throw error;

if(!updated||!updated.length){
throw new Error("The profile update was not saved.");
}

await loadChannel();

if(typeof updateAuthUI==="function"){
await updateAuthUI();
}

status.textContent="Channel saved successfully!";
status.style.color="#176b35";

}catch(error){
status.textContent="Error: "+error.message;
status.style.color="#b00020";
}finally{
button.disabled=false;
}
});

/* STARTUP */

document.addEventListener("DOMContentLoaded",loadChannel);

supabaseClient.auth.onAuthStateChange(()=>{
setTimeout(loadChannel,0);
});
</script>

</body>
</html>
