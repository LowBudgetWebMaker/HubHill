
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Video - HubHill</title>
<link rel="icon" href="HubHill.png">
<link rel="stylesheet" href="auth.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="auth.js" defer></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #e9edf2;
  color: #333;
  font: 13px Arial, sans-serif;
}

a { color: #155a9c; text-decoration: none; }
a:hover { text-decoration: underline; }

header {
  background: white;
  border-bottom: 1px solid #aaa;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  padding: 14px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.brand {
  font-size: 27px;
  font-weight: bold;
  color: #245b91;
}

.brand span { color: #444; }

nav {
  background: linear-gradient(#397dbb,#20558d);
  border-bottom: 2px solid #153e6b;
}

.nav-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  flex-wrap: wrap;
}

nav a {
  color: white;
  font-weight: bold;
  padding: 12px 20px;
}

nav a:hover {
  background: #164673;
  text-decoration: none;
}

.container {
  max-width: 850px;
  margin: 22px auto;
  padding: 0 12px;
}

.panel {
  background: white;
  border: 1px solid #b8c4d1;
  margin-bottom: 18px;
}

.panel-title {
  background: linear-gradient(#eaf3fc,#c8dff4);
  color: #245b91;
  font-size: 16px;
  font-weight: bold;
  padding: 11px;
  border-bottom: 1px solid #b8c4d1;
}

.panel-content { padding: 20px; }

label {
  display: block;
  margin: 16px 0 6px;
  font-weight: bold;
}

input, textarea, select {
  display: block;
  width: 100%;
  max-width: 600px;
  padding: 9px;
  border: 1px solid #aaa;
  background: white;
  font: 13px Arial, sans-serif;
}

textarea {
  height: 120px;
  resize: vertical;
}

button {
  background: linear-gradient(#fff,#ddd);
  border: 1px solid #999;
  padding: 9px 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 18px;
}

button:hover { background: #dce9f7; }
button:disabled { opacity: .6; cursor: wait; }

.notice {
  background: #fffbe5;
  border: 1px solid #e5d493;
  padding: 12px;
  line-height: 1.6;
  margin-bottom: 15px;
}

#status {
  margin-top: 16px;
  font-weight: bold;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#preview {
  display: none;
  width: 100%;
  max-width: 450px;
  max-height: 260px;
  margin-top: 15px;
  background: black;
}

#successLink {
  display: none;
  margin-top: 12px;
}

[hidden] { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="brand">
      Hub<span>Hill</span>
    </a>

    <div class="auth-links">
      <span data-auth-guest>
        <a href="#" data-open-auth="login">Log In</a>
      </span>

      <span data-auth-user hidden>
        Welcome, <a href="channel.html">
          <strong data-username></strong>
        </a> |
        <button type="button" data-logout>Log Out</button>
      </span>
    </div>
  </div>
</header>

<nav>
  <div class="nav-inner">
    <a href="index.html">Home</a>
    <a href="index.html#featured">Videos</a>
    <a href="channel.html">My Channel</a>
    <a href="upload.html">Upload</a>
  </div>
</nav>

<div class="container">
  <section class="panel">
    <div class="panel-title">Upload a Video to HubHill</div>

    <div class="panel-content">

      <div class="notice">
        <strong>HubHill Video Uploads</strong>
        <p>
          Upload your videos and share them with the HubHill community.
        </p>
        Maximum file size: <strong>25 MB</strong>.
        Supported formats: <strong>MP4 and WebM</strong>.
      </div>

      <p id="loginNotice">Checking your account...</p>

      <form id="uploadForm" hidden>

        <label for="videoFile">Choose Video File</label>
        <input
          type="file"
          id="videoFile"
          accept=".mp4,.webm,video/mp4,video/webm"
          required
        >

        <video id="preview" controls preload="metadata"></video>

        <label for="videoTitle">Video Title</label>
        <input
          type="text"
          id="videoTitle"
          maxlength="100"
          placeholder="Enter your video title..."
          required
        >

        <label for="videoDescription">Description</label>
        <textarea
          id="videoDescription"
          maxlength="5000"
          placeholder="Tell viewers about your video..."
        ></textarea>

        <label for="videoCategory">Category</label>
        <select id="videoCategory" required>
          <option value="Entertainment">Entertainment</option>
          <option value="Gaming">Gaming</option>
          <option value="Comedy">Comedy</option>
          <option value="Music">Music</option>
          <option value="Education">Education</option>
          <option value="People & Blogs">People & Blogs</option>
          <option value="Technology">Technology</option>
        </select>

        <button type="submit" id="uploadButton">
          Upload Video
        </button>

      </form>

      <p id="status" aria-live="polite"></p>
      <a id="successLink" href="channel.html">
        Go to My Channel
      </a>

    </div>
  </section>
</div>

<script>
const MAX_FILE_SIZE = 25 * 1024 * 1024;

const form = document.getElementById("uploadForm");
const fileInput = document.getElementById("videoFile");
const preview = document.getElementById("preview");
const statusBox = document.getElementById("status");
const uploadButton = document.getElementById("uploadButton");
const loginNotice = document.getElementById("loginNotice");
const successLink = document.getElementById("successLink");

let previewURL = null;
let durationSeconds = 0;

function setStatus(message, error = false) {
  statusBox.textContent = message;
  statusBox.style.color = error ? "#b00020" : "#176b35";
}

async function checkLogin() {
  const { data, error } = await supabaseClient.auth.getUser();

  if (!error && data.user) {
    form.hidden = false;
    loginNotice.hidden = true;
  } else {
    form.hidden = true;
    loginNotice.hidden = false;
    loginNotice.textContent =
      "You must log in to upload videos.";
  }
}

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];

  if (previewURL) {
    URL.revokeObjectURL(previewURL);
    previewURL = null;
  }

  preview.style.display = "none";
  preview.removeAttribute("src");
  preview.load();
  durationSeconds = 0;
  setStatus("");

  if (!file) return;

  const extension = file.name.split(".").pop().toLowerCase();

  if (!["mp4", "webm"].includes(extension)) {
    setStatus("Only MP4 and WebM videos are allowed.", true);
    fileInput.value = "";
    return;
  }

  if (file.size > MAX_FILE_SIZE) {
    setStatus("Your video exceeds the 25 MB limit.", true);
    fileInput.value = "";
    return;
  }

  previewURL = URL.createObjectURL(file);
  preview.src = previewURL;
  preview.style.display = "block";
});

preview.addEventListener("loadedmetadata", () => {
  if (Number.isFinite(preview.duration)) {
    durationSeconds = Math.round(preview.duration);
  }
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  const file = fileInput.files[0];

  if (!file) {
    setStatus("Please choose a video.", true);
    return;
  }

  const extension = file.name.split(".").pop().toLowerCase();

  if (!["mp4", "webm"].includes(extension)) {
    setStatus("Only MP4 and WebM videos are allowed.", true);
    return;
  }

  if (file.size > MAX_FILE_SIZE) {
    setStatus("Your video exceeds the 25 MB limit.", true);
    return;
  }

  const title = document.getElementById("videoTitle").value.trim();
  const description =
    document.getElementById("videoDescription").value.trim();
  const category =
    document.getElementById("videoCategory").value;

  if (!title || title.length > 100) {
    setStatus("Enter a title of up to 100 characters.", true);
    return;
  }

  uploadButton.disabled = true;
  successLink.style.display = "none";
  setStatus("Checking account...");

  try {
    const { data: authData, error: authError } =
      await supabaseClient.auth.getUser();

    if (authError || !authData.user) {
      throw new Error("Please log in first.");
    }

    const user = authData.user;
    const fileID = crypto.randomUUID();
    const storageKey =
      user.id + "/" + fileID + "." + extension;

    const contentType =
      extension === "mp4" ? "video/mp4" : "video/webm";

    setStatus("Uploading video. Please wait...");

    const { error: uploadError } =
      await supabaseClient.storage
        .from("hubhill-videos")
        .upload(storageKey, file, {
          contentType: contentType,
          upsert: false
        });

    if (uploadError) throw uploadError;

    setStatus("Saving video information...");

    const { data: videoRecord, error: databaseError } =
      await supabaseClient
        .from("videos")
        .insert({
          user_id: user.id,
          title: title,
          description: description,
          category: category,
          storage_key: storageKey,
          duration_seconds: durationSeconds
        })
        .select("id")
        .single();

    if (databaseError) {
      const { error: cleanupError } =
        await supabaseClient.storage
          .from("hubhill-videos")
          .remove([storageKey]);

      if (cleanupError) {
        throw new Error(
          databaseError.message +
          ". The uploaded file also could not be cleaned up: " +
          cleanupError.message
        );
      }

      throw databaseError;
    }

    setStatus("Video uploaded successfully!");

    form.reset();
    preview.style.display = "none";
    preview.removeAttribute("src");
    preview.load();

    if (previewURL) {
      URL.revokeObjectURL(previewURL);
      previewURL = null;
    }

    durationSeconds = 0;

    successLink.href = "watch.html?id=" +
      encodeURIComponent(videoRecord.id);
    successLink.textContent = "View Uploaded Video";
    successLink.style.display = "inline-block";

  } catch (error) {
    setStatus("Upload failed: " + error.message, true);
  } finally {
    uploadButton.disabled = false;
  }
});

document.addEventListener("DOMContentLoaded", () => {
  checkLogin();

  supabaseClient.auth.onAuthStateChange(() => {
    setTimeout(checkLogin, 0);
  });
});
</script>

</body>
</html>
