
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Favorites - HubHill</title>
<link rel="icon" href="HubHill.png">
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="auth.js" defer></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf2;color:#333;font:13px Arial,sans-serif}
a{color:#155a9c;text-decoration:none}
a:hover{text-decoration:underline}
header{background:white;border-bottom:1px solid #aaa}
.header-inner{max-width:1100px;margin:auto;padding:18px 12px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-size:25px;font-weight:bold;color:#245b91}
nav{background:linear-gradient(#397dbb,#20558d);border-bottom:2px solid #153e6b}
.nav-inner{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap}
nav a{padding:12px 20px;color:white;font-weight:bold;border-right:1px solid #174b7e}
nav a:hover{background:#164673;text-decoration:none}
.container{max-width:1100px;margin:20px auto;padding:0 12px}
.panel{background:white;border:1px solid #b8c4d1}
.panel-title{background:linear-gradient(#eaf3fc,#c8dff4);color:#245b91;font-size:15px;font-weight:bold;padding:10px;border-bottom:1px solid #b8c4d1}
.panel-content{padding:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{min-width:0}
.thumb{height:125px;background:linear-gradient(135deg,#aec5dc,#416e9e);border:1px solid #999;display:grid;place-items:center;color:white;font-size:35px}
.video-title{font-weight:bold;margin-top:8px;overflow-wrap:anywhere}
.info{color:#777;font-size:11px;margin-top:5px}
button{background:linear-gradient(white,#ddd);border:1px solid #999;padding:7px 12px;cursor:pointer;font-weight:bold;margin-top:9px}
button:hover{background:#dce9f7}
button:disabled{opacity:.5;cursor:wait}
.message{padding:15px;background:#fffbe5;border:1px solid #e5d493}
[hidden]{display:none!important}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="header-inner">
<a href="index.html" class="brand">HubHill</a>
<div class="auth-links">
<span data-auth-guest>
<a href="#" data-open-auth="signup">Sign Up</a> |
<a href="#" data-open-auth="login">Log In</a>
</span>
<span data-auth-user hidden>
Welcome, <a href="channel.html"><strong data-username></strong></a> |
<button type="button" data-logout>Log Out</button>
</span>
</div>
</div>
</header>

<nav>
<div class="nav-inner">
<a href="index.html">Home</a>
<a href="index.html#featured">Videos</a>
<a href="channel.html">My Channel</a>
<a href="upload.html">Upload</a>
<a href="favorites.html">My Favorites</a>
</div>
</nav>

<div class="container">
<section class="panel">
<div class="panel-title">★ My Favorite Videos</div>
<div class="panel-content">
<p id="message" class="message">Loading your favorites...</p>
<div id="favoritesGrid" class="grid"></div>
</div>
</section>
</div>

<script>
const grid=document.getElementById("favoritesGrid");
const message=document.getElementById("message");

async function loadFavorites(){
grid.replaceChildren();
message.hidden=false;
message.textContent="Loading your favorites...";

try{
const {data:{user},error:authError}=await supabaseClient.auth.getUser();
if(authError)throw authError;

if(!user){
message.textContent="Please log in to see your favorite videos.";
return;
}

const {data:favorites,error:favoritesError}=await supabaseClient
.from("video_favorites")
.select("video_id")
.eq("user_id",user.id);

if(favoritesError)throw favoritesError;

if(!favorites||favorites.length===0){
message.textContent="You haven't added any favorite videos yet.";
return;
}

const ids=favorites.map(f=>f.video_id);

const {data:videos,error:videosError}=await supabaseClient
.from("videos")
.select("id,title,category,created_at")
.in("id",ids)
.order("created_at",{ascending:false});

if(videosError)throw videosError;

if(!videos||videos.length===0){
message.textContent="No favorite videos are currently available.";
return;
}

message.hidden=true;

videos.forEach(video=>{
const card=document.createElement("div");
card.className="card";

const thumb=document.createElement("a");
thumb.href="watch.html?id="+encodeURIComponent(video.id);
thumb.className="thumb";
thumb.textContent="▶";

const title=document.createElement("div");
title.className="video-title";

const titleLink=document.createElement("a");
titleLink.href=thumb.href;
titleLink.textContent=video.title;
title.appendChild(titleLink);

const info=document.createElement("div");
info.className="info";
info.textContent="Category: "+(video.category||"Uncategorized");

const remove=document.createElement("button");
remove.type="button";
remove.textContent="Remove Favorite";

remove.addEventListener("click",async()=>{
remove.disabled=true;
remove.textContent="Removing...";

const {error}=await supabaseClient
.from("video_favorites")
.delete()
.eq("user_id",user.id)
.eq("video_id",video.id);

if(error){
alert("Could not remove favorite: "+error.message);
remove.disabled=false;
remove.textContent="Remove Favorite";
return;
}

card.remove();

if(!grid.children.length){
message.hidden=false;
message.textContent="You haven't added any favorite videos yet.";
}
});

card.append(thumb,title,info,remove);
grid.appendChild(card);
});

}catch(error){
console.error(error);
message.hidden=false;
message.textContent="Unable to load favorites: "+error.message;
}
}

document.addEventListener("DOMContentLoaded",loadFavorites);
</script>
</body>
</html>
